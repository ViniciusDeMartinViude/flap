<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Carpet Challenge</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <script src="/socket.io/socket.io.js"></script>
  <!-- Phaser 3 CDN (or your local phaser.js) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      touch-action: none; /* prevent scroll on tap */
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .join {
      position: absolute;
      z-index: 10;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .join-box {
      background: rgba(0, 0, 0, 0.95);
      border-radius: 24px;
      border: 2px solid #ffcc33;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(90vw, 380px);
      color: #fff;
      text-align: center;
    }

    .join-box h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .join-box label {
      font-size: 14px;
      text-align: left;
      opacity: 0.85;
    }

    .join-box input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 4px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .join-box input#room {
      text-transform: uppercase;
    }

    .join-box button {
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      outline: none;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #007bff, #00c2ff);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.8);
    }

    .join-box button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    /* Optional: orientation message when in portrait */
    #rotateHint {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      padding: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="join">
    <div class="join-box">
      <h1>Magic Carpet Challenge</h1>
      <p style="font-size:13px; opacity:0.9;">
        Enter the room code and your name to join the game.<br />
        Please rotate your phone to <strong>landscape</strong>.
      </p>

      <div>
        <label for="room">Room code</label>
        <input id="room" type="text" maxlength="6" placeholder="ROOM" />
      </div>

      <div>
        <label for="name">Your name</label>
        <input id="name" type="text" placeholder="Name" />
      </div>

      <button id="join">Join</button>
    </div>
  </div>

  <div id="game"></div>

  <div id="rotateHint">
    Please rotate your device to <br /><strong>landscape</strong> to play.
  </div>

  <script src="game.js"></script>
  <script>
    // Simple orientation hint
    function checkOrientation() {
      const hint = document.getElementById("rotateHint");
      if (window.innerWidth < window.innerHeight) {
        hint.style.display = "flex";   // portrait
      } else {
        hint.style.display = "none";   // landscape
      }
    }
    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", checkOrientation);
    checkOrientation();

    // Prevent context menu (long-press) on mobile
    window.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
